# Builds Backstage.app and attaches it to a GitHub Release.
#
# HOW TO SHIP A NEW VERSION:
#   1. Update CFBundleShortVersionString in Sources/demos/Info.plist  (e.g. "1.1")
#   2. git add -A && git commit -m "v1.1"
#   3. git tag v1.1
#   4. git push && git push --tags
#
# GitHub Actions picks up the tag, builds the .app, and publishes a release
# that your friends can download directly from the GitHub Releases page.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14       # macOS Sonoma runner — matches our minimum target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Zip for distribution
        run: |
          ditto -c -k --keepParent Backstage.app Backstage.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Backstage.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
